<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración · Rodando UTP</title>
  <meta name="theme-color" content="#1E1B4B">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="panel-page">
  <header class="header scrolled">
    <div class="container header__inner">
      <a href="index.html" class="brand" aria-label="Volver al inicio">
        <img src="img/logo.svg" alt="Logo de Rodando UTP" class="brand__logo" width="48" height="48">
        <span class="brand__text"><span class="brand__name">Rodando <b>UTP</b></span><span class="brand__slogan">Administración</span></span>
      </a>
      <div class="header__actions">
        <span id="live" class="live" hidden><i></i><span id="liveTxt">En vivo</span></span>
        <button class="btn btn--sm btn--outline" id="logoutBtn" hidden>Cerrar sesión</button>
        <a class="btn btn--sm btn--primary" href="index.html">← Sitio</a>
      </div>
    </div>
  </header>

  <main class="container panel">
    <section id="loginBox" class="panel-card panel-card--narrow" hidden>
      <h2>Acceso de administrador</h2>
      <p style="color:var(--muted)">Demo: <code>admin@utpuebla.edu.mx</code> / <code>Demo1234!</code></p>
      <form id="loginForm" novalidate>
        <label class="field"><span>Correo institucional</span><input type="email" id="lCorreo" autocomplete="email"></label>
        <label class="field"><span>Contraseña</span><input type="password" id="lPass" autocomplete="current-password"></label>
        <small class="err" id="lError" style="display:block;margin-bottom:10px"></small>
        <button class="btn btn--primary btn--lg btn--block" type="submit">Entrar</button>
      </form>
    </section>

    <section id="app" hidden>
      <div class="panel-head">
        <div><span class="eyebrow">Panel de administración</span><h2>Gestión de datos</h2></div>
        <button class="btn btn--primary" id="newBtn" hidden>＋ Agregar</button>
      </div>
      <p class="admin-note">Los datos se actualizan solos cada 4 segundos: si alguien aparta un lugar o crea una cuenta desde otra pestaña, lo verás aquí.</p>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="panel-card table-wrap">
        <table class="tbl" id="tbl"><thead id="thead"></thead><tbody id="rows"></tbody></table>
        <div class="empty" id="emptyMsg" hidden>No hay registros.</div>
      </div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <button class="modal__x" data-close aria-label="Cerrar">×</button>
      <h3 id="formTitle"></h3>
      <form id="form" novalidate>
        <div id="fields"></div>
        <small class="err" id="fError" style="display:block;margin:8px 0"></small>
        <button class="btn btn--primary btn--lg btn--block" type="submit" id="fOk">Guardar</button>
      </form>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
